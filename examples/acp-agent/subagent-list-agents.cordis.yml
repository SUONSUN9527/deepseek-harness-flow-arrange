# Snapshot-only durable-agent catalog composition. Keep this scenario on the
# explicit continuable path so list_agents can observe the retained child.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: tool-subagent
        name: '@deepseek-ai/dsh-tool-subagent'
        config:
          provider: spawn
          toolName: subagent
          backgroundMode: continuable
          maxDepth: 1
